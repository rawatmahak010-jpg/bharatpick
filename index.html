<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bharat Pick</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 25px;
      text-align: center;
      background: #1c1c1c;
    }

    header h1 {
      font-size: 36px;
    }

    header p {
      margin-top: 8px;
      color: #aaa;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 50px 20px;
      text-align: center;
    }

    .welcome {
      padding: 60px 20px;
      border-radius: 20px;
      background: #222;
    }

    .welcome h2 {
      font-size: 32px;
      margin-bottom: 15px;
    }

    .welcome p {
      color: #bbb;
      font-size: 18px;
    }

    .photos {
      margin-top: 40px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .photo-box {
      height: 220px;
      background: #292929;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <h1>🇮🇳 Bharat Pick</h1>
    <p>Welcome to my website</p>
  </header>

  <main>

    <section class="welcome">
      <h2>Welcome to Bharat Pick</h2>
      <p>My photo collection is coming soon.</p>

      <div class="photos">
        <div class="photo-box">Photo coming soon</div>
        <div class="photo-box">Photo coming soon</div>
        <div class="photo-box">Photo coming soon</div>
      </div>
    </section>

  </main>

  <footer>
    © 2026 Bharat Pick
  </footer>

</body>
</html>
